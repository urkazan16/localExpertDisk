name: Test Release

on:
  workflow_dispatch:
    inputs:
      require_signing:
        description: Require macOS notarization and Windows code signing
        required: true
        type: boolean
        default: false
      publish_draft:
        description: Publish artifacts as a draft GitHub release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing vX.Y.Z tag used when publishing a draft
        required: false
        type: string
      previous_release_tag:
        description: Optional previous release used for a real upgrade smoke test
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
          - platform: windows
            os: windows-2022
          - platform: linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_REQUIRE_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.require_signing) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux bundle prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - run: npm ci
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: npm run release:version
      - name: Run release tooling tests
        run: npm run test:release
      - name: Import Windows signing certificate
        if: matrix.platform == 'windows' && env.RELEASE_REQUIRE_SIGNING == '1'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Windows signing secrets are missing" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "release-certificate.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item $certificatePath -Force
      - name: Build native bundles
        env:
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run release:build -- ${{ matrix.platform }}
      - name: Stage artifacts and checksums
        run: node tools/release-artifacts.mjs stage ${{ matrix.platform }} target/release/bundle release-artifacts
      - name: Verify staged checksums
        run: node tools/release-artifacts.mjs verify release-artifacts
      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos' && env.RELEASE_REQUIRE_SIGNING == '1'
        shell: bash
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          dmg=$(find release-artifacts -maxdepth 1 -name '*.dmg' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows' && env.RELEASE_REQUIRE_SIGNING == '1'
        shell: pwsh
        run: |
          Get-ChildItem release-artifacts -Filter *.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature for $($_.Name): $($signature.Status)" }
          }
      - name: Download previous release for upgrade smoke
        if: inputs.previous_release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
        run: |
          mkdir -p previous-artifacts
          case "${{ matrix.platform }}" in
            macos) pattern='*.dmg' ;;
            windows) pattern='*.exe' ;;
            linux) pattern='*.AppImage' ;;
          esac
          gh release download "$PREVIOUS_RELEASE_TAG" --dir previous-artifacts --pattern "$pattern"
      - name: Smoke install, relaunch and database preservation
        if: matrix.platform != 'windows'
        shell: bash
        run: bash .github/scripts/smoke-release-unix.sh ${{ matrix.platform }} release-artifacts previous-artifacts
      - name: Smoke install, relaunch and database preservation
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .github/scripts/smoke-release-windows.ps1 -Artifacts release-artifacts -PreviousArtifacts previous-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: local-expert-disk-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: local-expert-disk-*
          path: release-artifacts
          merge-multiple: true
      - name: Generate combined checksums
        run: |
          node tools/release-artifacts.mjs checksums release-artifacts
          node tools/release-artifacts.mjs verify release-artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          test -n "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" release-artifacts/* --draft --verify-tag --title "Local Expert Disk $RELEASE_TAG" --generate-notes
